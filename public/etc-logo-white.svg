<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="etcBlueGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0066CC" />
      <stop offset="100%" stop-color="#004AAD" />
    </linearGradient>
    <linearGradient id="etcGreenGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="50%" stop-color="#20C84A" />
      <stop offset="100%" stop-color="#0A9F3D" />
    </linearGradient>
  </defs>

  <!-- EMBLEM ICON (Left) -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="48" fill="#0A1D37" stroke="#1E3A5F" stroke-width="1.5" />
    
    <!-- Outer Blue Swoosh -->
    <path d="M 50 8 A 42 42 0 0 1 92 50 C 92 65 83 78 70 86 C 65 78 68 64 68 52 C 68 36 58 24 50 18 Z" 
          fill="url(#etcBlueGradWhite)" />
    
    <!-- Inner Green Swoosh -->
    <path d="M 50 92 A 42 42 0 0 1 8 50 C 8 35 17 22 30 14 C 35 22 32 36 32 48 C 32 64 42 76 50 82 Z" 
          fill="url(#etcGreenGradWhite)" />

    <!-- Central Pillar -->
    <path d="M 36 34 C 36 28 42 22 50 22 C 58 22 64 28 64 34 L 64 48 C 64 54 58 60 50 60 C 42 60 36 54 36 48 Z" 
          fill="#1E293B" />
    
    <!-- Central Rising Green Leaf -->
    <path d="M 50 28 C 55 35 56 46 50 56 C 44 46 45 35 50 28 Z" 
          fill="url(#etcGreenGradWhite)" />

    <!-- Center Circle -->
    <circle cx="50" cy="50" r="14" fill="#FFFFFF" />
    <path d="M 44 46 L 56 46 M 50 46 L 50 54 M 46 54 L 54 54" stroke="#004AAD" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Star of Excellence -->
    <polygon points="50,11 52,15 56,15 53,18 54,22 50,19 46,22 47,18 44,15 48,15" fill="#4ADE80" />
  </g>

  <!-- TEXT BRANDING (Right) -->
  <g transform="translate(125, 20)">
    <text x="0" y="38" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="0.5">
      EASY TRUST
    </text>
    <text x="175" y="38" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="28" fill="#20C84A" letter-spacing="0.5">
      CORPORATION
    </text>
    
    <g transform="translate(378, 17)">
      <rect width="48" height="23" rx="6" fill="#20C84A" />
      <text x="24" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" fill="#062B5C" text-anchor="middle" letter-spacing="1">
        ETC
      </text>
    </g>

    <rect x="0" y="49" width="370" height="2" fill="url(#etcGreenGradWhite)" rx="1" />

    <text x="0" y="68" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="13" fill="#93C5FD" letter-spacing="1.8">
      BUILDING TRUST. DELIVERING EXCELLENCE.
    </text>
  </g>
</svg>
